<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página não encontrada | LGPD+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #171717;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; max-width: 400px; padding: 2rem; }
        .logo {
            display: inline-flex; align-items: center; justify-content: center;
            background: #111; border-radius: 12px; padding: 10px 16px; margin-bottom: 1.5rem;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }
        .logo img { height: 36px; width: auto; }
        h1 { font-size: 5rem; font-weight: 900; color: #6baf3e; line-height: 1; }
        p { font-size: 1rem; color: #555; margin-top: .75rem; }
        a {
            display: inline-block; margin-top: 2rem; background: #6baf3e; color: #fff;
            padding: .75rem 1.5rem; border-radius: 8px; text-decoration: none;
            font-weight: 600; font-size: .875rem; transition: background .2s;
        }
        a:hover { background: #5c9935; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><img src="/logo.webp" alt="Método LGPD+"></div>
        <h1>404</h1>
        <p>Página não encontrada. O endereço que você tentou acessar não existe.</p>
        <a href="/">Voltar ao início</a>
    </div>
</body>
</html>
